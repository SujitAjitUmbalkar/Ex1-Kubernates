apiVersion: apps/v1
kind: Deployment

# Information about the Deployment
metadata:
  name: myapp-deployment
  namespace: prod

spec:
  replicas: 3

  # Selector used to find the Pods managed by this Deployment
  selector:
    matchLabels:
      app: myapp

  # Template used to create the Pods
  template:
    metadata:
      labels:
        app: myapp

    spec:
      containers:
        - name: myapp
          image: nginx:latest

          # Resource limits for the container
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"

          # Port exposed by the container
          ports:
            - containerPort: 80